name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  integration:
    name: Docker stack proxy test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write offline .env
        run: |
          cat > .env <<'ENV'
          CF_OFFLINE=true
          CF_DOMAIN=example.com
          ENV

      - name: Build and start the stack (demo profile)
        run: docker compose --profile demo up -d --build

      - name: Wait for Caddy to serve the proxy
        run: |
          for i in $(seq 1 30); do
            if curl -ksS --resolve whoami.example.com:443:127.0.0.1 \
                 https://whoami.example.com >/dev/null; then
              echo "Caddy is responding on attempt $i"
              exit 0
            fi
            echo "waiting for Caddy... ($i)"
            sleep 2
          done
          echo "::error::Caddy did not become ready"
          docker compose --profile demo logs
          exit 1

      - name: Verify the proxy routes to whoami
        run: |
          body=$(curl -ksS --resolve whoami.example.com:443:127.0.0.1 \
                   https://whoami.example.com)
          echo "$body"
          echo "$body" | grep -qi "Hostname" \
            || { echo "::error::unexpected upstream response"; docker compose --profile demo logs; exit 1; }

      - name: Verify the bootstrap wrote an origin certificate
        run: |
          test -f certs/origin.pem && test -f certs/origin.key
          echo "key permissions: $(stat -c '%a' certs/origin.key)"
          openssl x509 -in certs/origin.pem -noout -ext subjectAltName
          openssl x509 -in certs/origin.pem -noout -ext subjectAltName | grep -q '\*.example.com'

      - name: Re-run bootstrap to prove idempotency
        run: |
          out=$(docker compose run --rm -T cloudflare-setup 2>&1)
          echo "$out"
          echo "$out" | grep -qi "self-signed certificate valid until" \
            || { echo "::error::second run did not skip the existing certificate"; exit 1; }

      - name: Tear down
        if: always()
        run: docker compose --profile demo down -v
