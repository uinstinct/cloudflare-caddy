[project]
name = "cf-setup"
version = "0.1.0"
description = "Idempotent Cloudflare bootstrap for the Caddy reverse-proxy stack"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
]

[project.scripts]
cf-setup = "cf_setup.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cf_setup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
